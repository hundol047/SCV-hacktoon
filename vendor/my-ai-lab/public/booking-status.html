<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신청 조회</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="services.css"><main class="service"><a href="index.html">일정으로</a><h1>신청 조회·취소</h1><form id="lookup"><label>접수번호<input name="id" required></label><label>조회키<input name="token" type="password" required autocomplete="off"></label><button>조회</button></form><label>접수증 불러오기<input id="receipt" type="file" accept="application/json,.json"></label><details><summary>조회키 복구</summary><form id="recover"><label>접수번호<input name="id" required></label><label>복구코드<input name="recoveryKey" type="password" required autocomplete="off"></label><button>조회키 재발급</button></form><p>접수증에 있는 복구코드가 필요합니다. 이메일·전화번호만으로는 조회키를 발급하지 않습니다.</p></details><button id="notify" type="button">웹 푸시 알림 켜기</button><button type="button" id="unnotify">이 신청의 푸시 알림 끄기</button><p>조회 화면은 30초마다 갱신합니다. 웹 푸시를 별도로 켜면 화면을 닫아도 알림을 받을 수 있습니다. 웹 푸시는 지원 브라우저·HTTPS 서버·알림 권한이 필요하며 APK 웹뷰에서는 지원하지 않을 수 있습니다.</p><p id="message" role="status"></p><section id="detail"></section></main><script type="module" src="service-i18n.js"></script><script type="module" src="booking-status.js"></script></html>
