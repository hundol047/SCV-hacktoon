<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여행 후기</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="services.css"><main class="service"><a href="index.html">일정으로</a><h1>여행 후기</h1><p>이용자가 직접 작성한 후기입니다. 방문 여부를 인증한 후기는 아니며, 운영자 검토 후 공개됩니다.</p><label>장소<select id="place"></select></label><p id="summary"></p><section id="list"></section><h2>후기 쓰기</h2><form id="review"><label>닉네임<input name="nickname" maxlength="30" required></label><label>별점<select name="rating"><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select></label><label>후기<textarea name="text" minlength="10" maxlength="2000" required placeholder="직접 경험한 내용을 적어 주세요. 연락처 등 개인정보는 넣지 마세요."></textarea></label><button>검토 요청</button></form><p id="message" role="status"></p></main><script type="module" src="service-i18n.js"></script><script type="module" src="reviews.js"></script></html>
